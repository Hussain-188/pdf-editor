spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text-plain,application/pdf
    min-response-size: 1024

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://your-domain.com}

logging:
  level:
    root: WARN
    com.pdfplatform: INFO
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","logger":"%logger{36}","msg":"%m"}%n'
