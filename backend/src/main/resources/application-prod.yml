spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

app:
  storage:
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET:pdf-platform}
    region: ${S3_REGION:us-east-1}

  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 900000
    refresh-expiration: 2592000000

logging:
  level:
    root: WARN
    com.pdfplatform: INFO
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","logger":"%logger{36}","msg":"%m"}%n'
