spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  storage:
    base-path: ./test-storage
  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-signing
    access-token-expiry: 900000
    refresh-token-expiry: 2592000000
  guest:
    session-expiry-hours: 24
    max-documents: 3
    max-file-size-mb: 50
  upload:
    max-file-size-mb: 200
    max-pages: 2000
    allowed-types:
      - application/pdf
